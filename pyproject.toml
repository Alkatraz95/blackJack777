[tool.poetry]
name = "pythonproject555"
version = "0.1.0"
description = "Выпуск банковских операций"
authors = ["Your Name"]
packages = [
    { include = "src" }
]

[tool.poetry.dependencies]
python = "^3.14"
requests = "^2.34.2"
python-dotenv = "^1.2.4"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1.1,<10.0.0"
flake8 = "^7.0.0"
mypy = "^1.10.0"
black = "^24.0.0"
pytest-cov = "^5.0.0"
isort = "^9.0.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
lines_after_imports = 2
